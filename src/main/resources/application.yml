spring:
  application:
    name: seatly

  flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    # properties:
    #   hibernate:
    #     format_sql: true

  data:
    redis:
      host: 168.107.59.168
      port: 6379

jwt:
  secret: this-is-very-secret-key-change-it
  access-token-expire-ms: 3600000 # 1시간
