spring:
  application:
    name: seatly

  flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    # properties:
    #   hibernate:
    #     format_sql: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: 127.0.0.1
      port: 6379

jwt:
  secret: this-is-very-secret-key-change-it
  access-token-expire-ms: 3600000 # 1시간
  refresh-token-expire-ms: 1209600000 # 14일

file:
  upload-dir: ${user.home}/seatly/uploads